name: GitHub Metrics (Lowlighter)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "metrics-*.svg"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Panel estilo Consola / Terminal Hacker
      - name: Generate Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-terminal.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Thomasvidela
          template: terminal
          base: header, activity, community, repositories, metadata
          config_timezone: America/Argentina/Buenos_Aires
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_lines: yes
          extras_css: |
            svg {
              border: 1px solid #00F0FF;
              border-radius: 8px;
            }

      # 2. Ciudad Isométrica 3D (isocalendar) + Calendario de Commits + Lenguajes
      - name: Generate Isometric 3D & Calendar Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-isometric.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Thomasvidela
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          extras_css: |
            svg {
              background-color: #050814 !important;
              border: 1px solid #00F0FF;
              border-radius: 8px;
              color: #94A3B8 !important;
            }
            h2, h3, .field {
              color: #00F0FF !important;
            }
            .calendar .day, svg.calendar.isometric .day {
              stroke: #050814;
            }
